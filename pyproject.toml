[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmet"
version = "0.2.0"
description = "Quantitative meteorology toolkit: power spectra, Helmholtz decomposition, equatorial-wave filtering, E-P and wave-activity fluxes, potential vorticity and the dynamic tropopause, tropical-cyclone diagnostics, wave packets, ensemble sensitivity, and global conservation budgets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
helmholtz = ["pyshtools", "xarray"]
tc = ["eccodes", "pyshtools", "xarray"]
test = ["pytest"]
all = ["pyshtools", "xarray", "eccodes", "pytest"]

[tool.setuptools]
packages = ["quantmet"]

[tool.setuptools.package-data]
quantmet = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
