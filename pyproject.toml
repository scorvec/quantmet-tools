[project]
name = "quantmet"
version = "0.1.0"
description = "Quantitative meteorology toolkit: DCT power spectra, spherical-harmonic Helmholtz decomposition, Wheeler-Kiladis wave filtering, fast TC detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
helmholtz = ["pyshtools", "xarray"]
