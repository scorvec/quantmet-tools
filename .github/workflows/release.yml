name: build

# Builds the sdist and wheel on every change to the package and checks them: twine's strict metadata check and an
# import of the installed wheel in a clean environment. A published GitHub release (tag vX.Y.Z = quantmet.__version__)
# also uploads them to PyPI by Trusted Publishing - no token is stored; PyPI lists this repository, this workflow and
# the "pypi" environment as the project's trusted publisher.
on:
  push:
    paths: ["quantmet/**", "pyproject.toml", "MANIFEST.in", "README.md", "CHANGELOG.md", "CITATION.cff", ".github/workflows/release.yml"]
  pull_request:
    paths: ["quantmet/**", "pyproject.toml", "MANIFEST.in", "README.md", "CHANGELOG.md", "CITATION.cff", ".github/workflows/release.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the metadata (PyPI rendering of the README included)
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import quantmet; print(quantmet.__version__)"
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        run: |
          v=$("$RUNNER_TEMP/wheel-env/bin/python" -c "import quantmet; print(quantmet.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match the package version $v"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quantmet/
    permissions:
      id-token: write  # the OIDC token Trusted Publishing exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
