name: docs

# Builds the documentation site (mkdocs.yml; API pages from the docstrings) on every change, strictly - any warning
# fails the build - and deploys it from main to GitHub Pages: https://scorvec.com/quantmet-tools/.
on:
  push:
    paths: ["docs/**", "mkdocs.yml", "quantmet/**", "README.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "quantmet/**", "README.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
